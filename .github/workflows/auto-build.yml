name: Auto Build Native Swift IPA (TrollStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Swift Source Files & Project Config
        run: |
          mkdir -p vToolsSurvey

          # 1. Tạo Info.plist
          cat << 'EOF' > vToolsSurvey/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>vTools Survey Pro</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để định vị và tính toán tọa độ VN-2000.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để đo đạc và lưu tuyến tracklog thực địa.</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

