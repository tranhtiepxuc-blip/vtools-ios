name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild -project *.xcodeproj \
            -scheme vtools-ios \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/vtools.xcarchive \
            archive | xcpretty || xcodebuild -project *.xcodeproj -scheme vtools-ios -sdk iphoneos -configuration Release -archivePath build/vtools.xcarchive archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/vtools.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist || echo "Export skipped or needs ExportOptions.plist"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            build/**/*.ipa
            build/vtools.xcarchive
