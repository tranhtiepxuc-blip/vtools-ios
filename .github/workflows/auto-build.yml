          # 6. Tạo vToolsSurveyApp.swift
          cat << 'EOF' > vToolsSurvey/vToolsSurveyApp.swift
          import SwiftUI

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 7. Tạo project.yml cho XcodeGen
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              info:
                path: vToolsSurvey/Info.plist
              settings:
                DEVELOPMENT_TEAM: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Project with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Packaging IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_trollstore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_trollstore.ipa
          path: vtools_survey_trollstore.ipa
