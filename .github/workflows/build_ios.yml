name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Khởi tạo iOS Project & Tải thư viện
      - name: Re-generate iOS Project
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Thêm mô tả cấp quyền GPS vào Info.plist
      - name: Add Location Permissions to Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true

      # 5. Build bản Unsigned cho thiết bị thật
      - name: Build Unsigned IPA
        run: |
          flutter build ios --release --no-codesign

      # 6. Đóng gói Runner.app thành IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 7. Upload file IPA lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_custom.ipa
          path: vtools_survey_custom.ipa
