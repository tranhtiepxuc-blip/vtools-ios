name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Khởi tạo thư mục iOS & Tải thư viện
      - name: Re-generate iOS Project Files
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Build IPA dạng Unsigned (Hoàn toàn phù hợp với TrollStore)
      - name: Build Unsigned IPA
        run: |
          flutter build ipa --no-codesign

      # 5. Tìm và gom file .ipa ra thư mục gốc
      - name: Prepare IPA file
        run: |
          cp build/ios/ipa/*.ipa vtools_survey_custom.ipa

      # 6. Tải file .ipa lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build
          path: vtools_survey_custom.ipa
