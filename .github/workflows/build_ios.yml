name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Khởi tạo iOS Project & Tải thư viện
      - name: Re-generate iOS Project & Get Dependencies
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Thêm quyền GPS vào Info.plist
      - name: Add Location Permissions to Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true

      # 5. Cài đặt CocoaPods (Pods) trực tiếp
      - name: Install Pods
        run: |
          cd ios
          pod install

      # 6. Sửa cấu hình Xcode để tắt Code Sign hoàn toàn ở cấp độ Workspace
      - name: Disable Code Signing in Project Files
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig

      # 7. Biên dịch dự án bằng xcodebuild archive
      - name: Archive Unsigned App
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 8. Đóng gói trực tiếp Runner.app bên trong xcarchive thành file IPA
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 9. Upload file IPA lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_custom.ipa
          path: vtools_survey_custom.ipa
