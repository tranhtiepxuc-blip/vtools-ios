name: Build Native Swift IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt xcodegen và dựng dự án Swift Native
      - name: Install xcodegen & Generate Swift Project
        run: |
          brew install xcodegen

          # Tạo file Info.plist thật cho app
          mkdir -p vToolsSurvey
          cat << 'EOF' > vToolsSurvey/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để đo đạc bản đồ.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS.</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          # Tạo file cấu hình project.yml trỏ tới Info.plist vật lý
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              info:
                path: vToolsSurvey/Info.plist
              settings:
                DEVELOPMENT_TEAM: "1234567890"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF

          # Tạo file code Swift chính
          cat << 'EOF' > vToolsSurvey/ContentView.swift
          import SwiftUI
          import MapKit

          struct ContentView: View {
              @State private var region = MKCoordinateRegion(
                  center: CLLocationCoordinate2D(latitude: 10.7769, longitude: 106.7009),
                  span: MKCoordinateSpan(latitudeDelta: 0.01, longitudeDelta: 0.01)
              )

              var body: some View {
                  VStack {
                      Text("vTools Survey GIS (iPhone 15 Pro)")
                          .font(.headline)
                          .padding()
                      
                      Map(coordinateRegion: $region, showsUserLocation: true)
                          .edgesIgnoringSafeArea(.all)
                  }
              }
          }

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # Sinh xcodeproj
          xcodegen generate

      # 3. Build ứng dụng dạng Unsigned
      - name: Build App with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 4. Đóng gói Runner/App thành IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_native.ipa Payload

      # 5. Xuất file IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_native.ipa
          path: vtools_survey_native.ipa
