name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Tạo lại cấu hình iOS & tải thư viện
      - name: Re-generate iOS Project
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Tắt yêu cầu Code Signing trong Xcode
      - name: Disable Code Signing in Project
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj

      # 5. Build ứng dụng Flutter iOS dạng Release không ký code
      - name: Build Flutter iOS App
        run: |
          flutter build ios --release --no-codesign

      # 6. Đóng gói Runner.app thành file .ipa chuẩn TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 7. Tải file .ipa lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build
          path: vtools_survey_custom.ipa
