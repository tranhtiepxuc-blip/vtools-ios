name: Build Native Swift IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen & Generate Fully Functional vTools App
        run: |
          brew install xcodegen
          mkdir -p vToolsSurvey

          # 1. Info.plist
          cat << 'EOF' > vToolsSurvey/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>vTools Survey</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.1</string>
              <key>CFBundleVersion</key>
              <string>3</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để định vị và tính toán tọa độ VN-2000.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để đo đạc và lưu tuyến tracklog thực địa.</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          # 2. VN2000Data.swift
          cat << 'EOF' > vToolsSurvey/VN2000Data.swift
          import Foundation
          import CoreLocation

          struct Province: Identifiable, Hashable {
              let id = UUID()
              let name: String
              let centralMeridian: Double
              let zone: String = "Múi 3 độ"
          }

          class VN2000Helper {
              static let provinces: [Province] = [
                  Province(name: "VN-2000 / BÌNH THUẬN", centralMeridian: 108.50),
                  Province(name: "VN-2000 / CÀ MAU", centralMeridian: 104.50),
                  Province(name: "VN-2000 / CẦN THƠ", centralMeridian: 105.00),
                  Province(name: "VN-2000 / CAO BẰNG", centralMeridian: 105.75),
                  Province(name: "VN-2000 / ĐÀ NẮNG", centralMeridian: 107.75),
                  Province(name: "VN-2000 / ĐẮK LẮK", centralMeridian: 108.50),
                  Province(name: "VN-2000 / ĐẮK NÔNG", centralMeridian: 108.50),
                  Province(name: "VN-2000 / TP. HỒ CHÍ MINH", centralMeridian: 105.75),
                  Province(name: "VN-2000 / HÀ NỘI", centralMeridian: 105.00),
                  Province(name: "VN-2000 / ĐỒNG NAI", centralMeridian: 107.75),
                  Province(name: "VN-2000 / BÌNH DƯƠNG", centralMeridian: 105.75),
                  Province(name: "VN-2000 / BÀ RỊA - VŨNG TÀU", centralMeridian: 107.75),
                  Province(name: "VN-2000 / LÂM ĐỒNG", centralMeridian: 107.75),
                  Province(name: "VN-2000 / KHÁNH HÒA", centralMeridian: 108.25),
                  Province(name: "VN-2000 / AN GIANG", centralMeridian: 104.75),
                  Province(name: "VN-2000 / KIÊN GIANG", centralMeridian: 104.50)
              ]

              static func wgs84ToVN2000(lat: Double, lon: Double, cm: Double) -> (x: Double, y: Double) {
                  let radLat = lat * .pi / 180.0
                  let radLon = lon * .pi / 180.0
                  let radCM = cm * .pi / 180.0
                  
                  let a = 6378137.0
                  let e2 = 0.00669438
                  let dLon = radLon - radCM
                  
                  let N = a / sqrt(1 - e2 * sin(radLat) * sin(radLat))
                  let T = tan(radLat) * tan(radLat)
                  let C = e2 / (1 - e2) * cos(radLat) * cos(radLat)
                  let A = dLon * cos(radLat)
                  
                  let M = a * ((1 - e2/4 - 3*e2*e2/64) * radLat - (3*e2/8 + 3*e2*e2/32) * sin(2*radLat) + (15*e2*e2/256) * sin(4*radLat))
                  
                  let x = M + N * tan(radLat) * (A*A/2 + (5 - T + 9*C + 4*C*C) * pow(A, 4)/24)
                  let y = 500000.0 + N * (A + (1 - T + C) * pow(A, 3)/6 + (5 - 18*T + T*T) * pow(A, 5)/120)
                  
                  return (x: x, y: y)
              }

              static func calculateArea(coords: [CLLocationCoordinate2D], cm: Double) -> Double {
                  guard coords.count >= 3 else { return 0 }
                  var pts: [(x: Double, y: Double)] = []
                  for c in coords { pts.append(wgs84ToVN2000(lat: c.latitude, lon: c.longitude, cm: cm)) }
                  var area: Double = 0
                  for i in 0..<pts.count {
                      let j = (i + 1) % pts.count
                      area += pts[i].x * pts[j].y - pts[j].x * pts[i].y
                  }
                  return abs(area) / 2.0
              }
          }
          EOF

          # 3. LocationManager.swift
          cat << 'EOF' > vToolsSurvey/LocationManager.swift
          import Foundation
          import CoreLocation

          class LocationManager: NSObject, ObservableObject, CLLocationManagerDelegate {
              private let manager = CLLocationManager()
              @Published var userLocation: CLLocationCoordinate2D?
              @Published var altitude: Double = 0
              @Published var accuracy: Double = 0
              @Published var speed: Double = 0
              
              override init() {
                  super.init()
                  manager.delegate = self
                  manager.desiredAccuracy = kCLLocationAccuracyBestForNavigation
                  manager.distanceFilter = kCLDistanceFilterNone
                  manager.requestWhenInUseAuthorization()
                  manager.startUpdatingLocation()
              }
              
              func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) {
                  if manager.authorizationStatus == .authorizedWhenInUse || manager.authorizationStatus == .authorizedAlways {
                      manager.startUpdatingLocation()
                  }
              }
              
              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                  guard let loc = locations.last else { return }
                  DispatchQueue.main.async {
                      self.userLocation = loc.coordinate
                      self.altitude = loc.altitude
                      self.accuracy = loc.horizontalAccuracy
                      self.speed = max(0, loc.speed)
                  }
              }
          }
          EOF

          # 4. MapViewRepresentable.swift
          cat << 'EOF' > vToolsSurvey/MapViewRepresentable.swift
          import SwiftUI
          import MapKit

          struct MapViewRepresentable: UIViewRepresentable {
              @Binding var region: MKCoordinateRegion
              var mapType: MKMapType
              @Binding var centerCoordinate: CLLocationCoordinate2D
              @Binding var pins: [CLLocationCoordinate2D]

              func makeUIView(context: Context) -> MKMapView {
                  let mapView = MKMapView()
                  mapView.delegate = context.coordinator
                  mapView.showsUserLocation = true
                  mapView.userTrackingMode = .follow
                  return mapView
              }

              func updateUIView(_ uiView: MKMapView, context: Context) {
                  uiView.mapType = mapType
                  
                  uiView.removeOverlays(uiView.overlays)
                  let currentAnnos = uiView.annotations.filter { !($0 is MKUserLocation) }
                  uiView.removeAnnotations(currentAnnos)
                  
                  for (idx, c) in pins.enumerated() {
                      let anno = MKPointAnnotation()
                      anno.coordinate = c
                      anno.title = "Mốc \(idx + 1)"
                      uiView.addAnnotation(anno)
                  }
                  
                  if pins.count >= 2 {
                      let polyline = MKPolyline(coordinates: pins, count: pins.count)
                      uiView.addOverlay(polyline)
                  }
                  if pins.count >= 3 {
                      let polygon = MKPolygon(coordinates: pins, count: pins.count)
                      uiView.addOverlay(polygon)
                  }
              }

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, MKMapViewDelegate {
                  var parent: MapViewRepresentable
                  init(_ parent: MapViewRepresentable) { self.parent = parent }

                  func mapViewDidChangeVisibleRegion(_ mapView: MKMapView) {
                      DispatchQueue.main.async {
                          self.parent.centerCoordinate = mapView.centerCoordinate
                      }
                  }

                  func mapView(_ mapView: MKMapView, rendererFor overlay: MKOverlay) -> MKOverlayRenderer {
                      if let polygon = overlay as? MKPolygon {
                          let renderer = MKPolygonRenderer(polygon: polygon)
                          renderer.fillColor = UIColor.systemMagenta.withAlphaComponent(0.3)
                          renderer.strokeColor = UIColor.systemMagenta
                          renderer.lineWidth = 2
                          return renderer
                      } else if let polyline = overlay as? MKPolyline {
                          let renderer = MKPolylineRenderer(polyline: polyline)
                          renderer.strokeColor = UIColor.systemBlue
                          renderer.lineWidth = 3
                          return renderer
                      }
                      return MKOverlayRenderer(overlay: overlay)
                  }
              }
          }
          EOF

          # 5. DocumentPicker.swift
          cat << 'EOF' > vToolsSurvey/DocumentPicker.swift
          import SwiftUI
          import UniformTypeIdentifiers
          import CoreLocation

          struct DocumentPicker: UIViewControllerRepresentable {
              var onPick: (URL, [CLLocationCoordinate2D]) -> Void

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.item], asCopy: true)
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: DocumentPicker
                  init(_ parent: DocumentPicker) { self.parent = parent }

                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      var extractedCoords: [CLLocationCoordinate2D] = []
                      
                      if let content = try? String(contentsOf: url, encoding: .utf8) {
                          let matches = content.matches(of: /-?\d+\.\d+/)
                          var numbers: [Double] = []
                          for m in matches {
                              if let num = Double(m.output) { numbers.append(num) }
                          }
                          
                          var i = 0
                          while i < numbers.count - 1 {
                              let num1 = numbers[i]
                              let num2 = numbers[i+1]
                              if (num1 >= 102 && num1 <= 110) && (num2 >= 8 && num2 <= 24) {
                                  extractedCoords.append(CLLocationCoordinate2D(latitude: num2, longitude: num1))
                                  i += 2
                              } else if (num2 >= 102 && num2 <= 110) && (num1 >= 8 && num1 <= 24) {
                                  extractedCoords.append(CLLocationCoordinate2D(latitude: num1, longitude: num2))
                                  i += 2
                              } else {
                                  i += 1
                              }
                          }
                      }
                      parent.onPick(url, extractedCoords)
                  }
              }
          }
          EOF

          # 6. ContentView.swift
          cat << 'EOF' > vToolsSurvey/ContentView.swift
          import SwiftUI
          import MapKit

          struct ContentView: View {
              @StateObject private var locationManager = LocationManager()
              @State private var selectedProvince = VN2000Helper.provinces[0]
              @State private var mapType: MKMapType = .hybrid
              @State private var centerCoordinate = CLLocationCoordinate2D(latitude: 11.08, longitude: 108.27)
              @State private var pins: [CLLocationCoordinate2D] = []
              
              // Sheet Controls
              @State private var showSideMenu = false
              @State private var showLayerManager = false
              @State private var showProjectionPicker = false
              @State private var showImportActionSheet = false
              @State private var showActionFabMenu = false
              @State private var showDocumentPicker = false
              @State private var importedFileName = ""
              
              @State private var region = MKCoordinateRegion(
                  center: CLLocationCoordinate2D(latitude: 11.08, longitude: 108.27),
                  span: MKCoordinateSpan(latitudeDelta: 0.005, longitudeDelta: 0.005)
              )

              var areaSqMeters: Double {
                  VN2000Helper.calculateArea(coords: pins, cm: selectedProvince.centralMeridian)
              }

              var body: some View {
                  ZStack {
                      // Map View Base
                      MapViewRepresentable(region: $region, mapType: mapType, centerCoordinate: $centerCoordinate, pins: $pins)
                          .edgesIgnoringSafeArea(.all)
                      
                      // Scope Crosshair Center
                      Image(systemName: "scope")
                          .font(.system(size: 32, weight: .light))
                          .foregroundColor(.white)
                          .shadow(color: .black, radius: 2)

                      VStack {
                          // Top Header Bar
                          HStack(spacing: 16) {
                              Button(action: { showSideMenu = true }) {
                                  Image(systemName: "line.3.horizontal").font(.title2).foregroundColor(.white)
                              }
                              Spacer()
                              Button(action: { showProjectionPicker = true }) {
                                  Image(systemName: "globe.americas.fill").foregroundColor(.white)
                              }
                              Button(action: { showImportActionSheet = true }) {
                                  Image(systemName: "map.fill").foregroundColor(.white)
                              }
                              Button(action: { showLayerManager = true }) {
                                  Image(systemName: "square.3.layers.3d.down.right.fill").foregroundColor(.white)
                              }
                          }
                          .padding()
                          .background(Color(red: 0.0, green: 0.6, blue: 0.5))
                          
                          Spacer()

                          // Floating Side Actions Menu
                          if showActionFabMenu {
                              VStack(alignment: .trailing, spacing: 10) {
                                  Button(action: {
                                      pins.append(centerCoordinate)
                                      showActionFabMenu = false
                                  }) {
                                      FabItem(title: "Tạo Mốc Tọa Độ (Tâm ngắm)", icon: "flag.fill", color: .teal)
                                  }
                                  
                                  Button(action: {
                                      if let loc = locationManager.userLocation {
                                          pins.append(loc)
                                      } else {
                                          pins.append(centerCoordinate)
                                      }
                                      showActionFabMenu = false
                                  }) {
                                      FabItem(title: "Tạo Dữ Liệu Điểm (GPS)", icon: "mappin.circle.fill", color: .blue)
                                  }
                                  
                                  Button(action: {
                                      pins.append(centerCoordinate)
                                      showActionFabMenu = false
                                  }) {
                                      FabItem(title: "Tạo Dữ Liệu Vùng / Đo Diện Tích", icon: "pentagon.fill", color: .purple)
                                  }

                                  if !pins.isEmpty {
                                      Button(action: { pins.removeAll(); importedFileName = "" }) {
                                          FabItem(title: "Xóa Tất Cả Điểm", icon: "trash.fill", color: .red)
                                      }
                                  }
                              }
                              .padding(.trailing, 16)
                              .transition(.move(edge: .bottom).combined(with: .opacity))
                          }

                          // Main FAB Button
                          HStack {
                              Spacer()
                              Button(action: { withAnimation { showActionFabMenu.toggle() } }) {
                                  Image(systemName: showActionFabMenu ? "xmark" : "plus")
                                      .font(.title).foregroundColor(.white)
                                      .frame(width: 56, height: 56)
                                      .background(Color.blue)
                                      .clipShape(Circle())
                                      .shadow(radius: 4)
                              }
                              .padding(.trailing, 16)
                          }

                          // Bottom HUD Panel (Hiển thị thật 100%)
                          VStack(alignment: .leading, spacing: 4) {
                              HStack {
                                  Text(selectedProvince.name)
                                      .font(.caption).bold().foregroundColor(.white)
                                  Spacer()
                                  if !importedFileName.isEmpty {
                                      Text("File: \(importedFileName)").font(.caption2).foregroundColor(.green)
                                  }
                              }
                              
                              let loc = locationManager.userLocation ?? centerCoordinate
                              let vn2000 = VN2000Helper.wgs84ToVN2000(lat: loc.latitude, lon: loc.longitude, cm: selectedProvince.centralMeridian)
                              let centerVN2000 = VN2000Helper.wgs84ToVN2000(lat: centerCoordinate.latitude, lon: centerCoordinate.longitude, cm: selectedProvince.centralMeridian)

                              Text(String(format: "Tọa độ X(E): %.3f m", vn2000.x))
                                  .font(.headline).bold().foregroundColor(.white)
                              Text(String(format: "Tọa độ Y(N): %.3f m", vn2000.y))
                                  .font(.headline).bold().foregroundColor(.white)

                              HStack {
                                  Text(String(format: "Sai số: %.2f m", locationManager.accuracy)).font(.caption).foregroundColor(.white)
                                  Spacer()
                                  Text(String(format: "Độ cao: %.2f m", locationManager.altitude)).font(.caption).foregroundColor(.white)
                                  Spacer()
                                  Text(String(format: "Tốc độ: %.2f m/s", locationManager.speed)).font(.caption).foregroundColor(.white)
                              }

                              if pins.count >= 3 {
                                  Divider().background(Color.yellow)
                                  HStack {
                                      Text("S.VÙNG ĐO: \(String(format: "%.1f m²", areaSqMeters)) (\(String(format: "%.3f ha", areaSqMeters/10000.0)))")
                                          .font(.caption).bold().foregroundColor(.yellow)
                                  }
                              }

                              Divider().background(Color.white)

                              HStack {
                                  Text(String(format: "Tâm độ X(E): %.3f m", centerVN2000.x)).font(.caption2).foregroundColor(.gray)
                                  Spacer()
                                  Text(String(format: "Tâm độ Y(N): %.3f m", centerVN2000.y)).font(.caption2).foregroundColor(.gray)
                              }
                          }
                          .padding(12)
                          .background(Color.black.opacity(0.8))
                          .cornerRadius(12)
                          .padding(.horizontal, 10)
                          .padding(.bottom, 10)
                      }
                  }
                  .sheet(isPresented: $showProjectionPicker) {
                      ProjectionPickerView(selectedProvince: $selectedProvince)
                  }
                  .sheet(isPresented: $showLayerManager) {
                      LayerManagerView(pinsCount: pins.count)
                  }
                  .sheet(isPresented: $showImportActionSheet) {
                      ImportFormatsView(showDocumentPicker: $showDocumentPicker)
                  }
                  .sheet(isPresented: $showSideMenu) {
                      SideMenuView(mapType: $mapType)
                  }
                  .sheet(isPresented: $showDocumentPicker) {
                      DocumentPicker { url, coords in
                          importedFileName = url.lastPathComponent
                          if !coords.isEmpty {
                              pins = coords
                              region.center = coords.first!
                          }
                      }
                  }
              }
          }

          struct FabItem: View {
              var title: String
              var icon: String
              var color: Color
              var body: some View {
                  HStack {
                      Text(title).font(.footnote).bold().padding(.horizontal, 8).padding(.vertical, 4).background(Color.white).cornerRadius(6)
                      Image(systemName: icon).foregroundColor(.white).padding(10).background(color).clipShape(Circle())
                  }
              }
          }

          struct ProjectionPickerView: View {
              @Binding var selectedProvince: Province
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  NavigationView {
                      List(VN2000Helper.provinces) { p in
                          Button(action: { selectedProvince = p; dismiss() }) {
                              HStack {
                                  Image(systemName: "star.circle.fill").foregroundColor(.red)
                                  VStack(alignment: .leading) {
                                      Text(p.name).font(.headline).foregroundColor(.blue)
                                      Text("Hệ chiếu địa phương, kinh tuyến trục \(String(format: "%.2f", p.centralMeridian))°, \(p.zone)")
                                          .font(.caption).foregroundColor(.secondary)
                                  }
                                  Spacer()
                                  if selectedProvince.id == p.id { Image(systemName: "checkmark").foregroundColor(.green) }
                              }
                          }
                      }
                      .navigationTitle("Cài đặt bản đồ VN-2000")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct LayerManagerView: View {
              var pinsCount: Int
              @State private var showSurveyImages = true
              @State private var showPoints = true
              @State private var showLines = true
              @State private var showPolygons = true

              var body: some View {
                  NavigationView {
                      List {
                          Toggle("HÌNH ẢNH KHẢO SÁT", isOn: $showSurveyImages)
                          Toggle("ĐIỂM MỐC TỌA ĐỘ (\(pinsCount))", isOn: $showPoints)
                          Toggle("DỮ LIỆU ĐƯỜNG", isOn: $showLines)
                          Toggle("DỮ LIỆU VÙNG (POLYGON)", isOn: $showPolygons)
                      }
                      .navigationTitle("QUẢN LÝ CÁC LỚP BẢN ĐỒ")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct ImportFormatsView: View {
              @Binding var showDocumentPicker: Bool
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  NavigationView {
                      List {
                          Button("Dữ liệu MBTiles (Offline Map)") { dismiss(); showDocumentPicker = true }
                          Button("Dữ liệu GeoJSON (.geojson)") { dismiss(); showDocumentPicker = true }
                          Button("Dữ liệu KML / KMZ") { dismiss(); showDocumentPicker = true }
                          Button("Dữ liệu GPX Tracklog") { dismiss(); showDocumentPicker = true }
                          Button("Dữ liệu Cad DXF / DWG") { dismiss(); showDocumentPicker = true }
                          Button("Dữ liệu Shapefile (.shp)") { dismiss(); showDocumentPicker = true }
                      }
                      .navigationTitle("CHỌN ĐỊNH DẠNG IMPORT")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct SideMenuView: View {
              @Binding var mapType: MKMapType
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  NavigationView {
                      List {
                          Section(header: Text("Bản đồ nền")) {
                              Button("Vệ tinh Hybrid (Có Tên Đường)") { mapType = .hybrid; dismiss() }
                              Button("Ảnh Vệ Tinh Thuần") { mapType = .satellite; dismiss() }
                              Button("Bản Đồ Giao Thông") { mapType = .standard; dismiss() }
                          }
                      }
                      .navigationTitle("Menu vTools Survey")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }
          EOF

          # 7. App
          cat << 'EOF' > vToolsSurvey/vToolsSurveyApp.swift
          import SwiftUI

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 8. project.yml
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              info:
                path: vToolsSurvey/Info.plist
              settings:
                DEVELOPMENT_TEAM: "1234567890"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF

          xcodegen generate

      - name: Build App with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_native.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_native.ipa
          path: vtools_survey_native.ipa
