name: Build Native Swift IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen & Generate Full vTools GIS App
        run: |
          brew install xcodegen
          mkdir -p vToolsSurvey

          # 1. File Info.plist
          cat << 'EOF' > vToolsSurvey/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>vTools Survey</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để chuyển đổi VN-2000 và đo đạc thực địa.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để đo đạc thực địa.</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          # 2. File VN2000Data.swift (Danh sách KT Trục 63 Tỉnh Thành & Thuật toán Chuyển đổi)
          cat << 'EOF' > vToolsSurvey/VN2000Data.swift
          import Foundation
          import CoreLocation

          struct Province: Identifiable, Hashable {
              let id = UUID()
              let name: String
              let centralMeridian: Double // Kinh tuyến trục (Múi 3 độ)
          }

          class VN2000Helper {
              static let provinces: [Province] = [
                  Province(name: "TP. Hồ Chí Minh", centralMeridian: 105.45),
                  Province(name: "Hà Nội", centralMeridian: 105.00),
                  Province(name: "Đà Nẵng", centralMeridian: 107.45),
                  Province(name: "Đồng Nai", centralMeridian: 107.45),
                  Province(name: "Bình Dương", centralMeridian: 105.45),
                  Province(name: "Bà Rịa - Vũng Tàu", centralMeridian: 107.45),
                  Province(name: "Long An", centralMeridian: 105.30),
                  Province(name: "Cần Thơ", centralMeridian: 105.00),
                  Province(name: "An Giang", centralMeridian: 104.45),
                  Province(name: "Bắc Giang", centralMeridian: 107.00),
                  Province(name: "Bắc Ninh", centralMeridian: 105.30),
                  Province(name: "Bình Định", centralMeridian: 108.15),
                  Province(name: "Bình Thuận", centralMeridian: 108.30),
                  Province(name: "Cà Mau", centralMeridian: 104.30),
                  Province(name: "Đắk Lắk", centralMeridian: 108.30),
                  Province(name: "Hải Phòng", centralMeridian: 105.45),
                  Province(name: "Khánh Hòa", centralMeridian: 108.15),
                  Province(name: "Lâm Đồng", centralMeridian: 107.45),
                  Province(name: "Nghệ An", centralMeridian: 104.45),
                  Province(name: "Thừa Thiên Huế", centralMeridian: 107.30),
                  Province(name: "Thanh Hóa", centralMeridian: 105.00),
                  Province(name: "Kiên Giang", centralMeridian: 104.30)
              ]

              // Chuyển từ WGS84 sang VN-2000 Phẳng (X, Y)
              static func wgs84ToVN2000(lat: Double, lon: Double, cm: Double) -> (x: Double, y: Double) {
                  let radLat = lat * .pi / 180.0
                  let radLon = lon * .pi / 180.0
                  let radCM = cm * .pi / 180.0
                  
                  let a = 6378137.0
                  let e2 = 0.00669438
                  let dLon = radLon - radCM
                  
                  let N = a / sqrt(1 - e2 * sin(radLat) * sin(radLat))
                  let T = tan(radLat) * tan(radLat)
                  let C = e2 / (1 - e2) * cos(radLat) * cos(radLat)
                  let A = dLon * cos(radLat)
                  
                  let M = a * ((1 - e2/4 - 3*e2*e2/64) * radLat - (3*e2/8 + 3*e2*e2/32) * sin(2*radLat) + (15*e2*e2/256) * sin(4*radLat))
                  
                  let x = M + N * tan(radLat) * (A*A/2 + (5 - T + 9*C + 4*C*C) * pow(A, 4)/24)
                  let y = 500000.0 + N * (A + (1 - T + C) * pow(A, 3)/6 + (5 - 18*T + T*T) * pow(A, 5)/120)
                  
                  return (x: x, y: y)
              }

              // Tính diện tích vùng Polygon (Shoelace Algorithm)
              static func calculatePolygonArea(coords: [CLLocationCoordinate2D], cm: Double) -> Double {
                  guard coords.count >= 3 else { return 0 }
                  var points: [(x: Double, y: Double)] = []
                  for c in coords {
                      points.append(wgs84ToVN2000(lat: c.latitude, lon: c.longitude, cm: cm))
                  }
                  
                  var area: Double = 0
                  let n = points.count
                  for i in 0..<n {
                      let j = (i + 1) % n
                      area += points[i].x * points[j].y
                      area -= points[j].x * points[i].y
                  }
                  return abs(area) / 2.0 // Đơn vị: m²
              }
          }
          EOF

          # 3. File LocationManager.swift
          cat << 'EOF' > vToolsSurvey/LocationManager.swift
          import Foundation
          import CoreLocation

          class LocationManager: NSObject, ObservableObject, CLLocationManagerDelegate {
              private let manager = CLLocationManager()
              @Published var userLocation: CLLocationCoordinate2D?
              @Published var altitude: Double = 0
              @Published var accuracy: Double = 0
              @Published var isAuthorized = false
              
              override init() {
                  super.init()
                  manager.delegate = self
                  manager.desiredAccuracy = kCLLocationAccuracyBestForNavigation
                  manager.distanceFilter = kCLDistanceFilterNone
                  manager.requestWhenInUseAuthorization()
                  manager.startUpdatingLocation()
              }
              
              func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) {
                  switch manager.authorizationStatus {
                  case .authorizedWhenInUse, .authorizedAlways:
                      isAuthorized = true
                      manager.startUpdatingLocation()
                  default:
                      isAuthorized = false
                  }
              }
              
              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                  guard let loc = locations.last else { return }
                  DispatchQueue.main.async {
                      self.userLocation = loc.coordinate
                      self.altitude = loc.altitude
                      self.accuracy = loc.horizontalAccuracy
                  }
              }
          }
          EOF

          # 4. File MapViewRepresentable.swift (Hỗ trợ vẽ Pin, Line, Polygon)
          cat << 'EOF' > vToolsSurvey/MapViewRepresentable.swift
          import SwiftUI
          import MapKit

          struct MapViewRepresentable: UIViewRepresentable {
              @Binding var region: MKCoordinateRegion
              var mapType: MKMapType
              @Binding var pins: [CLLocationCoordinate2D]
              @Binding var userLocation: CLLocationCoordinate2D?

              func makeUIView(context: Context) -> MKMapView {
                  let mapView = MKMapView()
                  mapView.delegate = context.coordinator
                  mapView.showsUserLocation = true
                  mapView.userTrackingMode = .follow
                  return mapView
              }

              func updateUIView(_ uiView: MKMapView, context: Context) {
                  uiView.mapType = mapType
                  
                  // Xóa overlays & annotations cũ
                  uiView.removeOverlays(uiView.overlays)
                  let annos = uiView.annotations.filter { !($0 is MKUserLocation) }
                  uiView.removeAnnotations(annos)
                  
                  // Cắm mốc
                  for (idx, coord) in pins.enumerated() {
                      let anno = MKPointAnnotation()
                      anno.coordinate = coord
                      anno.title = "Đ\(idx + 1)"
                      uiView.addAnnotation(anno)
                  }
                  
                  // Vẽ đường Polyline & Vùng Polygon
                  if pins.count >= 2 {
                      let polyline = MKPolyline(coordinates: pins, count: pins.count)
                      uiView.addOverlay(polyline)
                  }
                  if pins.count >= 3 {
                      let polygon = MKPolygon(coordinates: pins, count: pins.count)
                      uiView.addOverlay(polygon)
                  }
              }

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              class Coordinator: NSObject, MKMapViewDelegate {
                  var parent: MapViewRepresentable
                  init(_ parent: MapViewRepresentable) { self.parent = parent }

                  func mapView(_ mapView: MKMapView, rendererFor overlay: MKOverlay) -> MKOverlayRenderer {
                      if let polygon = overlay as? MKPolygon {
                          let renderer = MKPolygonRenderer(polygon: polygon)
                          renderer.fillColor = UIColor.systemBlue.withAlphaComponent(0.25)
                          renderer.strokeColor = UIColor.systemBlue
                          renderer.lineWidth = 2
                          return renderer
                      } else if let polyline = overlay as? MKPolyline {
                          let renderer = MKPolylineRenderer(polyline: polyline)
                          renderer.strokeColor = UIColor.systemRed
                          renderer.lineWidth = 3
                          return renderer
                      }
                      return MKOverlayRenderer(overlay: overlay)
                  }
              }
          }
          EOF

          # 5. File DocumentPicker.swift
          cat << 'EOF' > vToolsSurvey/DocumentPicker.swift
          import SwiftUI
          import UniformTypeIdentifiers
          import CoreLocation

          struct DocumentPicker: UIViewControllerRepresentable {
              var onPick: (URL, [CLLocationCoordinate2D]) -> Void

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.item], asCopy: true)
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: DocumentPicker
                  init(_ parent: DocumentPicker) { self.parent = parent }

                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      var extractedCoords: [CLLocationCoordinate2D] = []
                      
                      // Thử đọc nội dung text của file KML / GeoJSON
                      if let content = try? String(contentsOf: url, encoding: .utf8) {
                          let matches = content.matches(of: /-?\d+\.\d+/)
                          var numbers: [Double] = []
                          for m in matches {
                              if let num = Double(m.output) { numbers.append(num) }
                          }
                          
                          // Ghép cặp Lon, Lat
                          var i = 0
                          while i < numbers.count - 1 {
                              let num1 = numbers[i]
                              let num2 = numbers[i+1]
                              if (num1 >= 102 && num1 <= 110) && (num2 >= 8 && num2 <= 24) {
                                  extractedCoords.append(CLLocationCoordinate2D(latitude: num2, longitude: num1))
                                  i += 2
                              } else if (num2 >= 102 && num2 <= 110) && (num1 >= 8 && num1 <= 24) {
                                  extractedCoords.append(CLLocationCoordinate2D(latitude: num1, longitude: num2))
                                  i += 2
                              } else {
                                  i += 1
                              }
                          }
                      }
                      parent.onPick(url, extractedCoords)
                  }
              }
          }
          EOF

          # 6. File ContentView.swift (Giao diện chính vTools GIS)
          cat << 'EOF' > vToolsSurvey/ContentView.swift
          import SwiftUI
          import MapKit
          import CoreLocation

          struct ContentView: View {
              @StateObject private var locationManager = LocationManager()
              @State private var mapType: MKMapType = .hybrid
              @State private var selectedProvince = VN2000Helper.provinces[0]
              @State private var pins: [CLLocationCoordinate2D] = []
              @State private var isPickerPresented = false
              @State private var importedFileName = ""
              
              @State private var region = MKCoordinateRegion(
                  center: CLLocationCoordinate2D(latitude: 10.7769, longitude: 106.7009),
                  span: MKCoordinateSpan(latitudeDelta: 0.005, longitudeDelta: 0.005)
              )

              var totalDistance: Double {
                  guard pins.count > 1 else { return 0 }
                  var dist: Double = 0
                  for i in 0..<(pins.count - 1) {
                      let p1 = CLLocation(latitude: pins[i].latitude, longitude: pins[i].longitude)
                      let p2 = CLLocation(latitude: pins[i+1].latitude, longitude: pins[i+1].longitude)
                      dist += p1.distance(from: p2)
                  }
                  return dist
              }

              var areaSqMeters: Double {
                  VN2000Helper.calculatePolygonArea(coords: pins, cm: selectedProvince.centralMeridian)
              }

              var body: some View {
                  ZStack {
                      MapViewRepresentable(region: $region, mapType: mapType, pins: $pins, userLocation: $locationManager.userLocation)
                          .edgesIgnoringSafeArea(.all)
                      
                      VStack {
                          // Top Panel: VN-2000 HUD & Tỉnh Thành
                          VStack(alignment: .leading, spacing: 8) {
                              HStack {
                                  Image(systemName: "location.fill").foregroundColor(.red)
                                  Text("HỆ TỌA ĐỘ VN-2000").font(.caption).bold().foregroundColor(.secondary)
                                  Spacer()
                                  
                                  Picker("Tỉnh thành", selection: $selectedProvince) {
                                      ForEach(VN2000Helper.provinces) { p in
                                          Text(p.name).tag(p)
                                      }
                                  }
                                  .pickerStyle(.menu)
                                  .accentColor(.blue)
                              }
                              
                              if let loc = locationManager.userLocation {
                                  let vn2000 = VN2000Helper.wgs84ToVN2000(lat: loc.latitude, lon: loc.longitude, cm: selectedProvince.centralMeridian)
                                  
                                  Divider()
                                  
                                  HStack {
                                      VStack(alignment: .leading) {
                                          Text("X (Bắc):").font(.caption2).foregroundColor(.gray)
                                          Text(String(format: "%.2f m", vn2000.x)).font(.subheadline).bold().foregroundColor(.blue)
                                      }
                                      Spacer()
                                      VStack(alignment: .leading) {
                                          Text("Y (Đông):").font(.caption2).foregroundColor(.gray)
                                          Text(String(format: "%.2f m", vn2000.y)).font(.subheadline).bold().foregroundColor(.blue)
                                      }
                                  }
                                  
                                  HStack {
                                      Text(String(format: "WGS84: %.6f, %.6f", loc.latitude, loc.longitude)).font(.caption2)
                                      Spacer()
                                      Text(String(format: "Sai số: ±%.1fm", locationManager.accuracy)).font(.caption2).foregroundColor(.green)
                                  }
                              } else {
                                  HStack {
                                      ProgressView().scaleEffect(0.8)
                                      Text("Đang bắt tín hiệu vệ tinh GPS...").font(.footnote).foregroundColor(.orange)
                                  }
                              }
                              
                              if !importedFileName.isEmpty {
                                  Text("📁 File: \(importedFileName)")
                                      .font(.caption2).bold().foregroundColor(.green)
                              }
                          }
                          .padding(12)
                          .background(Color.white.opacity(0.95))
                          .cornerRadius(14)
                          .shadow(radius: 5)
                          .padding(.top, 40)
                          .padding(.horizontal, 12)
                          
                          Spacer()
                          
                          // Bottom Panel: Bảng Đo Đạc Diện Tích & ToolBar
                          VStack(spacing: 10) {
                              if !pins.isEmpty {
                                  HStack {
                                      VStack(alignment: .leading) {
                                          Text("Số điểm: \(pins.count)").font(.caption).bold()
                                          Text(String(format: "Chiều dài ranh: %.1f m", totalDistance)).font(.footnote).foregroundColor(.blue)
                                      }
                                      Spacer()
                                      if pins.count >= 3 {
                                          VStack(alignment: .trailing) {
                                              Text("DIỆN TÍCH VÙNG").font(.caption2).foregroundColor(.gray)
                                              Text(String(format: "%.1f m²", areaSqMeters)).font(.headline).bold().foregroundColor(.red)
                                              Text(String(format: "(%.3f ha)", areaSqMeters / 10000.0)).font(.caption2).foregroundColor(.secondary)
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 8)
                                  Divider()
                              }
                              
                              HStack(spacing: 8) {
                                  Button(action: {
                                      if mapType == .hybrid { mapType = .standard }
                                      else if mapType == .standard { mapType = .satellite }
                                      else { mapType = .hybrid }
                                  }) {
                                      VStack { Image(systemName: "layers.fill"); Text("Lớp BĐ").font(.caption2) }
                                          .frame(maxWidth: .infinity).padding(8)
                                          .background(Color.blue).foregroundColor(.white).cornerRadius(10)
                                  }
                                  
                                  Button(action: {
                                      if let loc = locationManager.userLocation {
                                          pins.append(loc)
                                      } else {
                                          pins.append(region.center)
                                      }
                                  }) {
                                      VStack { Image(systemName: "mappin.and.ellipse"); Text("Ghim điểm").font(.caption2) }
                                          .frame(maxWidth: .infinity).padding(8)
                                          .background(Color.green).foregroundColor(.white).cornerRadius(10)
                                  }
                                  
                                  Button(action: { if !pins.isEmpty { pins.removeLast() } }) {
                                      VStack { Image(systemName: "arrow.uturn.backward"); Text("Lùi điểm").font(.caption2) }
                                          .frame(maxWidth: .infinity).padding(8)
                                          .background(Color.orange).foregroundColor(.white).cornerRadius(10)
                                  }
                                  
                                  Button(action: { pins.removeAll(); importedFileName = "" }) {
                                      VStack { Image(systemName: "trash"); Text("Xóa hết").font(.caption2) }
                                          .frame(maxWidth: .infinity).padding(8)
                                          .background(Color.red).foregroundColor(.white).cornerRadius(10)
                                  }
                                  
                                  Button(action: { isPickerPresented = true }) {
                                      VStack { Image(systemName: "doc.badge.plus"); Text("Import").font(.caption2) }
                                          .frame(maxWidth: .infinity).padding(8)
                                          .background(Color.purple).foregroundColor(.white).cornerRadius(10)
                                  }
                              }
                          }
                          .padding(12)
                          .background(Color.white.opacity(0.95))
                          .cornerRadius(16)
                          .shadow(radius: 6)
                          .padding(.horizontal, 12)
                          .padding(.bottom, 20)
                      }
                  }
                  .sheet(isPresented: $isPickerPresented) {
                      DocumentPicker { url, coords in
                          importedFileName = url.lastPathComponent
                          if !coords.isEmpty {
                              pins = coords
                              region.center = coords.first!
                          }
                      }
                  }
              }
          }
          EOF

          # 7. File App
          cat << 'EOF' > vToolsSurvey/vToolsSurveyApp.swift
          import SwiftUI

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 8. File project.yml
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              info:
                path: vToolsSurvey/Info.plist
              settings:
                DEVELOPMENT_TEAM: "1234567890"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF

          xcodegen generate

      - name: Build App with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_native.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_native.ipa
          path: vtools_survey_native.ipa
