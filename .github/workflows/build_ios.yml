name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Tạo thư mục iOS & Cài thư viện
      - name: Re-generate iOS Project
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Build cho Simulator (Không cần chứng chỉ hay Apple ID)
      - name: Build Unsigned Simulator App
        run: |
          flutter build ios --simulator

      # 5. Đóng gói Runner.app thành file .ipa cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 6. Tải file .ipa lên Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build
          path: vtools_survey_custom.ipa
