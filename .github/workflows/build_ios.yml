name: Build Native Swift IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Tạo nhanh dự án Swift Native bằng Xcodegen
      - name: Install xcodegen & Generate Swift Project
        run: |
          brew install xcodegen
          
          # Tạo file cấu hình dự án
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              settings:
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
                DEVELOPMENT_TEAM: ""
                INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "vTools cần vị trí GPS để đo đạc và hiển thị bản đồ VN-2000."
                INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "vTools cần vị trí GPS để đo đạc."
          EOF

          # Tạo mã nguồn Swift Native cơ bản
          mkdir -p vToolsSurvey
          cat << 'EOF' > vToolsSurvey/ContentView.swift
          import SwiftUI
          import MapKit

          struct ContentView: View {
              @State private var region = MKCoordinateRegion(
                  center: CLLocationCoordinate2D(latitude: 10.7769, longitude: 106.7009), // TP.HCM
                  span: MKCoordinateSpan(latitudeDelta: 0.01, longitudeDelta: 0.01)
              )

              var body: some View {
                  VStack {
                      Text("vTools Survey GIS (Native Swift)")
                          .font(.headline)
                          .padding()
                      
                      Map(coordinateRegion: $region, showsUserLocation: true)
                          .edgesIgnoringSafeArea(.all)
                  }
              }
          }

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # Sinh file dự án .xcodeproj
          xcodegen generate

      # 3. Biên dịch trực tiếp ra Runner.app (dùng 'build' thay vì 'archive' để không bị dính bước Validate)
      - name: Build Swift App with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 4. Đóng gói app thành IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_native.ipa Payload

      # 5. Upload file IPA lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_native.ipa
          path: vtools_survey_native.ipa
