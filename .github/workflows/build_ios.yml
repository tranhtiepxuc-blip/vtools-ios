name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Khởi tạo iOS Project & Tải thư viện
      - name: Re-generate iOS Project & Get Dependencies
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Thêm quyền GPS vào Info.plist
      - name: Add Location Permissions to Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true

      # 5. Cấu hình Pods / Xcode workspace
      - name: Build Flutter CocoaPods
        run: |
          cd ios
          pod install

      # 6. Build bằng xcodebuild ép bỏ qua toàn bộ yêu cầu Code Sign
      - name: Build Unsigned App with xcodebuild
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 7. Đóng gói Runner.app thành IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 8. Upload file IPA lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_custom.ipa
          path: vtools_survey_custom.ipa
