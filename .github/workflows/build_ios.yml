name: Build Native Swift IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Tạo cấu trúc thư mục & các file Swift riêng biệt
      - name: Install xcodegen & Generate Project
        run: |
          brew install xcodegen

          # Tạo thư mục chứa code
          mkdir -p vToolsSurvey

          # File 1: Info.plist
          cat << 'EOF' > vToolsSurvey/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>vTools Survey</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để chuyển đổi VN-2000 và đo đạc.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>vTools cần vị trí GPS để đo đạc thực địa.</string>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          # File 2: LocationManager.swift
          cat << 'EOF' > vToolsSurvey/LocationManager.swift
          import Foundation
          import CoreLocation

          class LocationManager: NSObject, ObservableObject, CLLocationManagerDelegate {
              private let manager = CLLocationManager()
              @Published var userLocation: CLLocationCoordinate2D?
              @Published var altitude: Double = 0
              @Published var accuracy: Double = 0
              
              override init() {
                  super.init()
                  manager.delegate = self
                  manager.desiredAccuracy = kCLLocationAccuracyBestForNavigation
                  manager.requestWhenInUseAuthorization()
                  manager.startUpdatingLocation()
              }
              
              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                  guard let loc = locations.last else { return }
                  DispatchQueue.main.async {
                      self.userLocation = loc.coordinate
                      self.altitude = loc.altitude
                      self.accuracy = loc.horizontalAccuracy
                  }
              }
          }

          struct VN2000Converter {
              static func convertToVN2000(lat: Double, lon: Double, centralMeridian: Double = 105.75) -> (x: Double, y: Double) {
                  let radLat = lat * .pi / 180.0
                  let radLon = lon * .pi / 180.0
                  let radCM = centralMeridian * .pi / 180.0
                  
                  let a = 6378137.0
                  let dLon = radLon - radCM
                  
                  let x = a * (radLat + sin(radLat) * cos(radLat) * 0.00669438)
                  let y = a * dLon * cos(radLat) + 500000.0
                  
                  return (x: x, y: y)
              }
          }
          EOF

          # File 3: MapViewRepresentable.swift
          cat << 'EOF' > vToolsSurvey/MapViewRepresentable.swift
          import SwiftUI
          import MapKit

          struct MapViewRepresentable: UIViewRepresentable {
              @Binding var region: MKCoordinateRegion
              var mapType: MKMapType
              @Binding var pins: [CLLocationCoordinate2D]

              func makeUIView(context: Context) -> MKMapView {
                  let mapView = MKMapView()
                  mapView.showsUserLocation = true
                  mapView.userTrackingMode = .follow
                  return mapView
              }

              func updateUIView(_ uiView: MKMapView, context: Context) {
                  uiView.mapType = mapType
                  
                  let currentAnnos = uiView.annotations.filter { !($0 is MKUserLocation) }
                  uiView.removeAnnotations(currentAnnos)
                  
                  for (idx, coord) in pins.enumerated() {
                      let anno = MKPointAnnotation()
                      anno.coordinate = coord
                      anno.title = "Điểm \(idx + 1)"
                      uiView.addAnnotation(anno)
                  }
              }
          }
          EOF

          # File 4: DocumentPicker.swift
          cat << 'EOF' > vToolsSurvey/DocumentPicker.swift
          import SwiftUI
          import UniformTypeIdentifiers

          struct DocumentPicker: UIViewControllerRepresentable {
              var onPick: (URL) -> Void

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.item], asCopy: true)
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: DocumentPicker
                  init(_ parent: DocumentPicker) { self.parent = parent }

                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      parent.onPick(url)
                  }
              }
          }
          EOF

          # File 5: ContentView.swift
          cat << 'EOF' > vToolsSurvey/ContentView.swift
          import SwiftUI
          import MapKit
          import CoreLocation

          struct ContentView: View {
              @StateObject private var locationManager = LocationManager()
              @State private var mapType: MKMapType = .standard
              @State private var centralMeridian: Double = 105.75
              @State private var pins: [CLLocationCoordinate2D] = []
              @State private var isPickerPresented = false
              @State private var importedFileName = ""
              
              @State private var region = MKCoordinateRegion(
                  center: CLLocationCoordinate2D(latitude: 10.7769, longitude: 106.7009),
                  span: MKCoordinateSpan(latitudeDelta: 0.01, longitudeDelta: 0.01)
              )

              var totalDistance: Double {
                  guard pins.count > 1 else { return 0 }
                  var dist: Double = 0
                  for i in 0..<(pins.count - 1) {
                      let p1 = CLLocation(latitude: pins[i].latitude, longitude: pins[i].longitude)
                      let p2 = CLLocation(latitude: pins[i+1].latitude, longitude: pins[i+1].longitude)
                      dist += p1.distance(from: p2)
                  }
                  return dist
              }

              var body: some View {
                  ZStack {
                      MapViewRepresentable(region: $region, mapType: mapType, pins: $pins)
                          .edgesIgnoringSafeArea(.all)
                      
                      VStack {
                          VStack(alignment: .leading, spacing: 6) {
                              Text("📍 HỆ TỌA ĐỘ VÀ GPS")
                                  .font(.caption).bold().foregroundColor(.secondary)
                              
                              if let loc = locationManager.userLocation {
                                  let vn2000 = VN2000Converter.convertToVN2000(lat: loc.latitude, lon: loc.longitude, centralMeridian: centralMeridian)
                                  
                                  HStack {
                                      Text("WGS84:").bold()
                                      Text(String(format: "%.5f, %.5f", loc.latitude, loc.longitude))
                                  }.font(.footnote)
                                  
                                  HStack {
                                      Text("VN-2000:").bold().foregroundColor(.blue)
                                      Text(String(format: "X: %.2f | Y: %.2f", vn2000.x, vn2000.y))
                                          .bold().foregroundColor(.blue)
                                  }.font(.footnote)
                                  
                                  HStack {
                                      Text(String(format: "Độ chính xác: ±%.1fm | Cao độ: %.1fm", locationManager.accuracy, locationManager.altitude))
                                          .font(.caption2).foregroundColor(.gray)
                                  }
                              } else {
                                  Text("Đang định vị GPS...").font(.footnote).foregroundColor(.orange)
                              }
                              
                              if !importedFileName.isEmpty {
                                  Text("📁 File: \(importedFileName)")
                                      .font(.caption2).bold().foregroundColor(.green)
                              }
                          }
                          .padding(12)
                          .background(Color.white.opacity(0.92))
                          .cornerRadius(12)
                          .shadow(radius: 4)
                          .padding(.top, 40)
                          .padding(.horizontal, 16)
                          
                          Spacer()
                          
                          VStack(spacing: 8) {
                              if !pins.isEmpty {
                                  HStack {
                                      Text("Số điểm: \(pins.count)")
                                      Spacer()
                                      Text(String(format: "Khoảng cách: %.1f m", totalDistance)).bold()
                                  }
                                  .font(.footnote)
                                  .padding(.horizontal)
                              }
                              
                              HStack(spacing: 8) {
                                  Button(action: {
                                      if mapType == .standard { mapType = .satellite }
                                      else if mapType == .satellite { mapType = .hybrid }
                                      else { mapType = .standard }
                                  }) {
                                      Label("Lớp BĐ", systemImage: "layers.fill")
                                          .font(.caption).bold()
                                          .padding(8)
                                          .background(Color.blue)
                                          .foregroundColor(.white)
                                          .cornerRadius(8)
                                  }
                                  
                                  Button(action: {
                                      if let loc = locationManager.userLocation {
                                          pins.append(loc)
                                      } else {
                                          pins.append(region.center)
                                      }
                                  }) {
                                      Label("Ghim điểm", systemImage: "mappin.and.ellipse")
                                          .font(.caption).bold()
                                          .padding(8)
                                          .background(Color.green)
                                          .foregroundColor(.white)
                                          .cornerRadius(8)
                                  }
                                  
                                  Button(action: { pins.removeAll() }) {
                                      Label("Xóa", systemImage: "trash")
                                          .font(.caption).bold()
                                          .padding(8)
                                          .background(Color.red)
                                          .foregroundColor(.white)
                                          .cornerRadius(8)
                                  }
                                  
                                  Button(action: { isPickerPresented = true }) {
                                      Label("Import", systemImage: "doc.badge.plus")
                                          .font(.caption).bold()
                                          .padding(8)
                                          .background(Color.orange)
                                          .foregroundColor(.white)
                                          .cornerRadius(8)
                                  }
                              }
                          }
                          .padding(12)
                          .background(Color.white.opacity(0.95))
                          .cornerRadius(16)
                          .shadow(radius: 5)
                          .padding(.horizontal, 16)
                          .padding(.bottom, 20)
                      }
                  }
                  .sheet(isPresented: $isPickerPresented) {
                      DocumentPicker { url in
                          importedFileName = url.lastPathComponent
                      }
                  }
              }
          }
          EOF

          # File 6: vToolsSurveyApp.swift
          cat << 'EOF' > vToolsSurvey/vToolsSurveyApp.swift
          import SwiftUI

          @main
          struct vToolsSurveyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # File 7: project.yml
          cat << 'EOF' > project.yml
          name: vToolsSurvey
          options:
            bundleIdPrefix: com.vtools
            deploymentTarget:
              iOS: "16.0"
          targets:
            vToolsSurvey:
              type: application
              platform: iOS
              sources: [vToolsSurvey]
              info:
                path: vToolsSurvey/Info.plist
              settings:
                DEVELOPMENT_TEAM: "1234567890"
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF

          # Sinh file xcodeproj
          xcodegen generate

      # 3. Build Unsigned App
      - name: Build App with xcodebuild
        run: |
          xcodebuild build \
            -project vToolsSurvey.xcodeproj \
            -scheme vToolsSurvey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 4. Đóng gói IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/vToolsSurvey.app Payload/
          zip -r vtools_survey_native.ipa Payload

      # 5. Xuất IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_native.ipa
          path: vtools_survey_native.ipa
