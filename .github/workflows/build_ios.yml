name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # 1. Lấy mã nguồn từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Khởi tạo iOS Project & Tải thư viện
      - name: Re-generate iOS Project & Get Dependencies
        run: |
          flutter create --org com.vtools --platforms=ios .
          flutter pub get

      # 4. Thêm quyền GPS vào Info.plist
      - name: Add Location Permissions to Info.plist
        run: |
          PLIST="ios/Runner/Info.plist"
          plutil -insert NSLocationWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "vTools cần truy cập vị trí GPS để đo đạc và định vị bản đồ." $PLIST || true

      # 5. Sinh cấu hình Pods & Tắt kiểm tra Code Sign trực tiếp trong file xcconfig
      - name: Bypass Code Signing in Build Config
        run: |
          flutter build ios --config-only
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig

      # 6. Build ứng dụng không mã hóa chữ ký
      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign

      # 7. Đóng gói Runner.app thành IPA cho TrollStore
      - name: Package IPA for TrollStore
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r vtools_survey_custom.ipa Payload

      # 8. Upload file IPA lên GitHub Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtools_survey_custom.ipa
          path: vtools_survey_custom.ipa
