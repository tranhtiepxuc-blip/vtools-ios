name: Build Swift IPA via Xcode SPM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS binary using xcodebuild
        run: |
          xcodebuild build \
            -scheme vToolsSurvey \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath .derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into iOS App structure
        run: |
          APP_NAME="vToolsSurvey"
          BUNDLE_ID="com.vtools.survey"
          
          BINARY_PATH=$(find .derived_data -name "$APP_NAME" -type f | grep "Release-iphoneos" | head -n 1)
          
          echo "Found binary at: $BINARY_PATH"
          
          if [ -z "$BINARY_PATH" ]; then
            echo "Error: Binary not found!"
            exit 1
          fi
          
          mkdir -p Payload/$APP_NAME.app
          cp "$BINARY_PATH" Payload/$APP_NAME.app/
          chmod +x Payload/$APP_NAME.app/$APP_NAME
          
          cat <<EOF > Payload/$APP_NAME.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Zip to IPA
        run: |
          zip -r vToolsSurvey_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vToolsSurvey-TrollStore-IPA
          path: vToolsSurvey_TrollStore.ipa
