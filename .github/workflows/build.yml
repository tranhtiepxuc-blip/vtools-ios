name: Build Swift IPA via Xcode SPM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App using xcodebuild with SPM
        run: |
          xcodebuild build \
            -scheme vToolsSurvey \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into iOS App structure
        run: |
          APP_NAME="vToolsSurvey"
          BUNDLE_ID="com.vtools.survey"
          
          # Tìm đường dẫn binary sau khi build xong
          BUILT_PRODUCTS_DIR=$(xcodebuild -scheme $APP_NAME -sdk iphoneos -configuration Release -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR =" | awk -F ' = ' '{print $2}')
          
          mkdir -p Payload
          cp -R "$BUILT_PRODUCTS_DIR/$APP_NAME.app" Payload/

      - name: Zip to IPA
        run: |
          zip -r vToolsSurvey_SPM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vToolsSurvey-TrollStore-IPA
          path: vToolsSurvey_SPM.ipa
