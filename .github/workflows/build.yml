name: Build Swift IPA via Xcode SPM

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App using xcodebuild with SPM
        run: |
          xcodebuild build \
            -scheme vToolsSurvey \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath .derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into iOS App structure
        run: |
          APP_NAME="vToolsSurvey"
          
          # Đường dẫn cố định nhờ -derivedDataPath .derived_data
          APP_PATH=".derived_data/Build/Products/Release-iphoneos/$APP_NAME.app"
          
          echo "Found app at: $APP_PATH"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: .app bundle not found at $APP_PATH"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

      - name: Zip to IPA
        run: |
          zip -r vToolsSurvey_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vToolsSurvey-TrollStore-IPA
          path: vToolsSurvey_TrollStore.ipa
