name: Build Swift IPA without Xcode Project

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Swift Package Manager
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release --triple arm64-apple-ios -Xswiftc -sdk -Xswiftc "$SDK_PATH"

      - name: Package into iOS App structure
        run: |
          APP_NAME="vToolsSurvey"
          BUNDLE_ID="com.vtools.survey"
          
          mkdir -p Payload/$APP_NAME.app
          
          cp .build/arm64-apple-ios/release/$APP_NAME Payload/$APP_NAME.app/
          
          cat <<EOF > Payload/$APP_NAME.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Zip to IPA
        run: |
          zip -r vToolsSurvey_Direct.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vToolsSurvey-TrollStore-IPA
          path: vToolsSurvey_Direct.ipa
